name: Windows build and offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Build without optional FTDI binaries
        shell: pwsh
        run: |
          $env:PATH = '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;' + $env:PATH
          ./scripts/build.ps1
          cmake -S . -B build -DBUILD_GUI_CHECKS=ON -DBUILD_RADIO_CHECKS=ON
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { throw 'Checks failed' }
          ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FT710Dashboard-Windows-x64
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
