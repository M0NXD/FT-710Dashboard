name: Windows build and offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned WinLibs x64 toolchain
        shell: pwsh
        run: |
          $taskToolchain = (Get-Content -Raw scripts/release-dependencies.json | ConvertFrom-Json).toolchain
          $taskToolchainZip = Join-Path $env:RUNNER_TEMP 'ft710-winlibs.zip'
          $taskToolchainDirectory = Join-Path $env:RUNNER_TEMP 'ft710-winlibs'
          Invoke-WebRequest -Uri $taskToolchain.url -OutFile $taskToolchainZip
          if ((Get-FileHash -LiteralPath $taskToolchainZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $taskToolchain.sha256) { throw 'Toolchain checksum mismatch' }
          Expand-Archive -LiteralPath $taskToolchainZip -DestinationPath $taskToolchainDirectory
          (Join-Path $taskToolchainDirectory 'mingw64/bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build without optional FTDI binaries
        shell: pwsh
        run: |
          ./scripts/build.ps1
          cmake -S . -B build -DBUILD_GUI_CHECKS=ON -DBUILD_RADIO_CHECKS=ON
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE) { throw 'Checks failed' }
          ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FT710Dashboard-Windows-x64
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
